name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Check project files
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/forge/ai/MainActivity.kt
      - name: Compile APK with detailed diagnostics
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --warning-mode all :app:assembleDebug 2>&1 | tee android-build.log
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: forge-build-error-log
          path: android-build.log
          if-no-files-found: ignore
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FORGE-AI-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
